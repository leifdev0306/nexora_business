name: "nexora_business"
description: "Aplicación de gestión para MIPYMES con sincronización offline y Supabase."
publish_to: "none"
version: "2.5.1+25"
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"
dependencies:
  flutter:
    sdk: "flutter"
  supabase_flutter: "^2.5.6"
  hive_flutter: "^1.1.0"
  hive: "^2.2.3"
  provider: "^6.1.2"
  connectivity_plus: "^6.0.5"
  google_fonts: "^6.2.1"
  flutter_slidable: "^3.1.1"
  fl_chart: "^0.69.0"
  intl: "^0.19.0"
  uuid: "^4.5.1"
  collection: "^1.18.0"
  flutter_local_notifications: "^17.2.3"
  url_launcher: "^6.3.0"
  pdf: "^3.11.1"
  printing: "^5.13.1"
  excel: "^2.1.0"
  share_plus: "^10.0.2"
  xml: "^6.5.0"
  path_provider: "^2.1.4"
  image_picker: "^1.1.2"
  cached_network_image: "^3.4.1"
  flutter_cache_manager: "^3.4.1"
  flutter_map: "^7.0.2"
  latlong2: "^0.9.1"
  geolocator: "^13.0.1"
  flutter_pos_printer_platform_monster: "^1.6.0"
  esc_pos_utils_plus: "^2.0.4"
  inno_build: "^0.4.0"
dev_dependencies:
  flutter_test:
    sdk: "flutter"
  build_runner: "^2.4.12"
  hive_generator: "^2.0.1"
  flutter_lints: "^4.0.0"
  flutter_launcher_icons: "^0.14.4"
  msix: "^3.16.7"
flutter:
  uses-material-design: true
  assets:
    - "assets/logo.png"
    - "assets/qr.jpg"
flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/logo.png"
  ios: true
  web:
    generate: false
  macos:
    generate: false
  linux:
    generate: false
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
msix_config:
  display_name: "Nexora Business"
  publisher_display_name: "Nexora Business"
  identity_name: "com.nexorabusiness.app"
  msix_version: "2.5.1.0"
  logo_path: "assets/logo.png"
  capabilities: "internetClient, privateNetworkClientServer"
  languages: "es-es, en-us"
  install_certificate: false
inno_build:
  app_id: "d6550aa6-0a3a-4a3b-915a-52d9447fbcaa"
