name: nexora_business
description: Aplicación de gestión para MIPYMES con sincronización offline y Supabase.
publish_to: 'none'
version: 2.4.0+24

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Backend y persistencia
  supabase_flutter: ^2.5.6
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  provider: ^6.1.2
  connectivity_plus: ^6.0.5

  # ─── UI y utilidades
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # ─── Notificaciones y enlaces
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.0

  # ─── Exportación (PDF, Excel, compartir)
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^2.1.0
  share_plus: ^10.0.2

  # ─── XML y archivos temporales
  xml: ^6.5.0
  path_provider: ^2.1.4

  # ─── Selector de imágenes (cámara + galería)
  image_picker: ^1.1.2

  # ─── Imágenes con caché persistente (offline)
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # ─── Mapas y geolocalización
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_lints: ^4.0.0

  # ─── Iconos multi-plataforma (soporta build.gradle.kts de Flutter moderno)
  flutter_launcher_icons: ^0.14.4

  # ─── Empaquetado Windows (.msix / instalador)
  msix: ^3.16.7

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/qr.jpg

# ============================================================
#  ICONOS · Android + Windows
#  Generar con:  dart run flutter_launcher_icons
#  Todo se genera desde assets/logo.png
# ============================================================
flutter_launcher_icons:
  # ─── Android
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/logo.png"

  # ─── iOS / Web / macOS / Linux (deshabilitados)
  ios: true
  web:
    generate: false
  macos:
    generate: false
  linux:
    generate: false

  # ─── Windows
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

# ============================================================
#  MSIX · Instalador Windows (opcional)
#  Ejecutar: dart run msix:create
# ============================================================
msix_config:
  display_name: Nexora Business
  publisher_display_name: Nexora Business
  identity_name: com.nexorabusiness.app
  msix_version: 2.4.0.0
  logo_path: assets/logo.png
  capabilities: internetClient, privateNetworkClientServer
  languages: es-es, en-us
  install_certificate: false