name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # 1. Genera solo la configuración (Podfile, Generated.xcconfig) sin compilar
      - name: Generar configuración iOS
        run: flutter build ios --config-only --no-codesign

      # 2. Parchea el Podfile: plataforma iOS y deshabilitar firma en todos los targets
      - name: Parchear Podfile
        run: |
          cd ios
          if grep -q "^[[:space:]]*platform :ios" Podfile; then
            sed -i '' "s/^[[:space:]]*platform :ios.*/platform :ios, '15.0'/" Podfile
          else
            sed -i '' "1i\\
            platform :ios, '15.0'
            " Podfile
          fi

          ruby -i -pe '
            if $_ =~ /post_install do \|installer\|/
              $_ = "post_install do |installer|\n"
              $_ << "  installer.pods_project.targets.each do |target|\n"
              $_ << "    flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)\n"
              $_ << "    target.build_configurations.each do |config|\n"
              $_ << "      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n"
              $_ << "      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n"
              $_ << "      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n"
              $_ << "      config.build_settings[\"DEVELOPMENT_TEAM\"] = \"\"\n"
              $_ << "      config.build_settings[\"PROVISIONING_PROFILE_SPECIFIER\"] = \"\"\n"
              $_ << "    end\n"
              $_ << "  end\n"
            end
          ' Podfile

          echo "----- Podfile (primeras 5 líneas) -----"
          head -5 Podfile

      # 3. Limpia cualquier referencia de firma en el proyecto Xcode generado
      - name: Limpiar project.pbxproj
        run: |
          cd ios
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' Runner.xcodeproj/project.pbxproj

      # 4. Fija el Podfile y reinstala Pods con la configuración sin firma
      - name: Reinstalar Pods
        run: |
          cd ios
          chmod 444 Podfile
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update

      # 5. Compila con xcodebuild directamente, forzando la no-firma en la línea de comandos
      - name: Compilar con xcodebuild (sin firma)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # 6. Empaqueta el .app resultante como IPA sin firmar
      - name: Empaquetar como IPA
        run: |
          mkdir Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: FlutterIpaExport.ipa
          retention-days: 30
