name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Forzar plataforma iOS y deshabilitar firma en Podfile
        run: |
          cd ios
          # 1. Elimina cualquier línea 'platform :ios' e inserta la versión 15.0
          sed -i '' '/platform :ios/d' Podfile
          sed -i '' "1i\\
          platform :ios, '15.0'
          " Podfile
          # 2. Inserta banderas de no-firma en todos los targets de Pods
          ruby -i -pe '
            if $_ =~ /post_install do \|installer\|/
              $_ << "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_IDENTITY\"] = \"\"\n    end\n  end\n"
            end
          ' Podfile
          echo "----- Podfile después de la modificación -----"
          head -15 Podfile

      - name: Limpiar configuración de firma del proyecto Xcode
        run: |
          cd ios
          # Elimina todas las referencias a firma en el proyecto principal
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' Runner.xcodeproj/project.pbxproj
          echo "----- Verificando limpieza -----"
          grep -n "DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj || echo "No se encontraron referencias a DEVELOPMENT_TEAM"

      - name: Limpiar Pods e instalar de nuevo
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update

      - name: Compilar sin firmar
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: FlutterIpaExport.ipa
          retention-days: 30
