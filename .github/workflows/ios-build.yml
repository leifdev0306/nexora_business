name: Build Unsigned IPA

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest  # Runner de macOS gratuito para repos públicos
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar sin firmar
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: FlutterIpaExport.ipa
