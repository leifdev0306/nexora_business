name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14  # macOS 14 no tiene el bug de validación de certificados de macOS 15
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar sin firmar (primer intento para regenerar archivos)
        run: flutter build ios --release --no-codesign || true

      - name: Parchear Podfile para deshabilitar firma en resource bundles
        run: |
          cd ios
          # Reemplaza el bloque post_install estándar por uno que también deshabilite
          # la firma en los resource bundles (origen del error "Development Team")
          ruby -i -pe '
            if $_ =~ /post_install do \|installer\|/
              $_ = "post_install do |installer|\n"
              $_ << "  installer.pods_project.targets.each do |target|\n"
              $_ << "    flutter_additional_ios_build_settings(target) if defined?(flutter_additional_ios_build_settings)\n"
              $_ << "    target.build_configurations.each do |config|\n"
              $_ << "      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n"
              $_ << "      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n"
              $_ << "      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n"
              $_ << "      config.build_settings[\"DEVELOPMENT_TEAM\"] = \"\"\n"
              $_ << "      config.build_settings[\"PROVISIONING_PROFILE_SPECIFIER\"] = \"\"\n"
              $_ << "    end\n"
              $_ << "  end\n"
            end
          ' Podfile
          echo "----- Podfile después de la modificación -----"
          tail -25 Podfile

      - name: Limpiar configuración de firma del proyecto Xcode
        run: |
          cd ios
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' Runner.xcodeproj/project.pbxproj
          echo "----- Verificando limpieza -----"
          grep -n "DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj || echo "No se encontraron referencias a DEVELOPMENT_TEAM"

      - name: Reinstalar Pods con la nueva configuración
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update

      - name: Compilar sin firmar (intento final)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: FlutterIpaExport.ipa
          retention-days: 30
